x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest@sha256:2f708001387aa9853e744a4a4d572d9970927c479c56d6c9e199f789c5173535
    container_name: jellyfin
    environment:
      - TZ=Europe/Amsterdam
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
      - JELLYFIN_PublishedServerUrl=http://192.168.0.10:8096 #optional
    volumes:
      - /mnt/NVME/docker/jellyfin/config:/config
      - /mnt/NVME/docker/jellyfin/transcodes:/transcodes
      - /mnt/HDD4000/data/media:/data
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    restart: unless-stopped
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.local.watermarkhu.nl`)
      - traefik.http.routers.jellyfin.entrypoints=https
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    networks:
      - proxy

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    container_name: jellyseerr
    environment:
      - TZ=Europe/Amsterdam
      - LOG_LEVEL=debug
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - /mnt/NVME/docker/jellyseerr-config:/app/config
    restart: unless-stopped
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyseerr.rule=Host(`request.local.watermarkhu.nl`)
      - traefik.http.routers.jellyseerr.entrypoints=https
      - traefik.http.routers.jellyseerr.tls=true
      - traefik.http.services.jellyseerr.loadbalancer.server.port=5055
    networks:
      - proxy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

networks:
  proxy:
    external: true
