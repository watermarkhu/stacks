services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:48e36b608b461273b9dae857725cd0561a127f2c694b687318f6d0c5ce63e5c9
    container_name: sonarr
    environment:
      - TZ=Etc/UTC
    volumes:
      - /mnt/NVME/docker/sonarr-config/data:/config
      - /mnt/HDD4000/data:/data
    ports:
      - 8989:8989
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.local.watermarkhu.nl`)
      - traefik.http.routers.sonarr.entrypoints=https
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    networks:
      - proxy
networks:
  proxy:
    external: true
