services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01
    container_name: sabnzbd
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/NVME/docker/sabnzbd-config:/config
      - /mnt/HDD4000/data/usenet/complete:/data/usenet/complete
      - /mnt/HDD4000/data/usenet/incomplete:/data/usenet/incomplete
    ports:
      - 8080:8080
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.local.watermarkhu.nl`)
      - traefik.http.routers.sabnzbd.entrypoints=https
      - traefik.http.routers.sabnzbd.tls=true
      - traefik.http.services.sabnzbd.loadbalancer.server.port=8080
    networks:
      - proxy
networks:
  proxy:
    external: true
