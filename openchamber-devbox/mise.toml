# Toolchain for the OpenChamber devbox.
#
# Copied into the image as mise's system config (/etc/mise/config.toml) and

[tools]
node = "26.13.1"
bun = "1.4.5"
uv = "0.13.10"
ruff = "0.17.6"
gh = "2.106.0"
rust = "1.100.0"
claude-code = "2.1.332"
"npm:@opencode/cli" = { version = "2.4.2", allow_builds = ["@opencode/cli"] }
"npm:@openchamber/web" = { version = "2.8.1", allow_builds = ["node-pty"] }
