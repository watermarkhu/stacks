# Toolchain for the OpenChamber devbox.
#
# Copied into the image as mise's system config (/etc/mise/config.toml) and

[tools]
node = "26.13.0"
bun = "1.4.4"
uv = "0.13.6"
ruff = "0.17.3"
gh = "2.103.3"
rust = "1.99.1"
"npm:@opencode/cli" = { version = "2.2.5", allow_builds = ["@opencode/cli"] }
"npm:@openchamber/web" = { version = "2.6.0", allow_builds = ["node-pty"] }
