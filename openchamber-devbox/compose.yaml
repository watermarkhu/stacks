name: openchamber

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  openchamber:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: openchamber
    init: true
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      - TZ=Europe/Amsterdam
    # Never default to 0.0.0.0: set BIND_ADDR to 127.0.0.1 (Traefik only) or the Tailscale IP.
    # 3000 / 3001 on the host are taken by ha-wa-bridge / dockhand, hence 3002.
    ports:
      - ${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3002}:3000
    volumes:
      # Edit mise.toml + `docker compose restart openchamber` to change tools, no rebuild needed.
      - ./mise.toml:/etc/mise/config.toml:ro
      # Tools, OpenCode auth + sessions, OpenChamber settings, SSH keys, dotfiles.
      - home:/home/dev
      - home:/workspace
    healthcheck:
      # Any HTTP response is healthy (the UI answers 401/redirects before login).
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start installs the whole toolchain.
      start_period: 5m
    labels:
      - traefik.enable=true
      - traefik.http.routers.openchamber.rule=Host(`openchamber.local.watermarkhu.nl`)
      - traefik.http.routers.openchamber.entrypoints=https
      - traefik.http.routers.openchamber.tls=true
      - traefik.http.services.openchamber.loadbalancer.server.port=3000
    networks:
      - proxy

  code:
    image: lscr.io/linuxserver/code-server:latest@sha256:4524d0b00478e41264f42e0e660c1819e3b7d0c460f78ce73e44fa39b2b55134
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUID: ${UID:-1000}
      PGID: ${GID:-1000}
      TZ: Europe/Amsterdam
      PASSWORD: "${CODE_SERVER_PASSWORD:?Set CODE_SERVER_PASSWORD in .env}"
      DEFAULT_WORKSPACE: /workspace
    volumes:
      - code_server_config:/config
      - home:/home/dev
      - home:/workspace
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.openchamber-code.rule=Host(`code.local.watermarkhu.nl`)
      - traefik.http.routers.openchamber-code.entrypoints=https
      - traefik.http.routers.openchamber-code.tls=true
      - traefik.http.services.openchamber-code.loadbalancer.server.port=8443
    networks:
      - proxy

volumes:
  home:
    # Back the shared devbox/code-server home with the external dataset.
    # Use a new volume name so the existing openchamber_home volume remains available for migration.
    name: openchamber_home_dataset
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WORKSPACE_DIR:?Set WORKSPACE_DIR in .env or Dockhand}
  code_server_config: {}

networks:
  proxy:
    external: true
