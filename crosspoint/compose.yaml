services:
  crosspoint-sync:
    image: ghcr.io/crosspoint-reader/crosspoint-sync:main@sha256:f04a3bd78a1e28cd5d21df53e4b8235711da51dff732210f08c86573f95ee9ae
    ports:
      - 8888:8080
    volumes:
      - /mnt/NVME/docker/crosspoint:/data
    environment:
      BASE_PATH: ${BASE_PATH:-}
      # Set to "true" on private instances once your accounts exist.
      REGISTRATION_DISABLED: "false"
      TRUST_PROXY: "true"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.crosspoint.rule=Host(`crosspoint.local.watermarkhu.nl`)
      - traefik.http.routers.crosspoint.entrypoints=https
      - traefik.http.routers.crosspoint.tls=true
      - traefik.http.services.crosspoint.loadbalancer.server.port=8080
    networks:
      - proxy
networks:
  proxy:
    external: true
