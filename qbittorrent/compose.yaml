x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:3d4c4545d51a690a0df15a2ff99038823a88a9822df8e794526447b9afbd7384
    container_name: qbittorrent
    environment:
      - TZ=Europe/Amsterdam
      - WEBUI_PORT=8090
      - TORRENTING_PORT=6881
    volumes:
      - /mnt/NVME/docker/qbittorrent-config:/config
      - /mnt/HDD4000/data/torrents:/data/torrents
    ports:
      - 8090:8090
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    stop_grace_period: 30s
    # TCP check: the WebUI may reject HTTP requests with host-header validation enabled
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.local.watermarkhu.nl`)
      - traefik.http.routers.qbittorrent.entrypoints=https
      - traefik.http.routers.qbittorrent.tls=true
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8090
    networks:
      - proxy
networks:
  proxy:
    external: true
