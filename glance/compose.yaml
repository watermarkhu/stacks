x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  glance:
    container_name: glance
    image: glanceapp/glance@sha256:bc5a392672c1ec8823c50b61f3bd4b7e5acc34fcbb8477862577b3af1c633875
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /mnt/NVME/docker/glance-config:/app/config
    ports:
      - 8088:8080
    labels:
      - traefik.enable=true
      - traefik.http.routers.glance.rule=Host(`glance.local.watermarkhu.nl`)
      - traefik.http.routers.glance.entrypoints=https
      - traefik.http.routers.glance.tls=true
      - traefik.http.services.glance.loadbalancer.server.port=8080
    networks:
      - proxy
networks:
  proxy:
    external: true
