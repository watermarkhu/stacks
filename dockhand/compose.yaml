x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  dockhand:
    image: fnsys/dockhand:latest@sha256:e82db7e76024d288c40a96ed023537961cfa4e60f1a87087f1990f64bde39fac
    container_name: dockhand
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 3001:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/NVME/docker/dockhand:/app/data
      - /mnt/NVME/docker/stacks:/app/stacks
    labels:
      - traefik.enable=true
      - traefik.http.routers.dockhand.rule=Host(`dockhand.local.watermarkhu.nl`)
      - traefik.http.routers.dockhand.entrypoints=https
      - traefik.http.routers.dockhand.tls=true
      - traefik.http.services.dockhand.loadbalancer.server.port=3000
    networks:
      - proxy
networks:
  proxy:
    external: true
