x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  dockhand:
    image: fnsys/dockhand:latest@sha256:515c6e0f28cf3922c51a2dfd3463b972880e40418c2464b1bc91b8a3afe66c7f
    container_name: dockhand
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 3001:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/NVME/docker/dockhand:/app/data
      - /mnt/NVME/docker/stacks:/app/stacks
    labels:
      - traefik.enable=true
      - traefik.http.routers.dockhand.rule=Host(`dockhand.local.watermarkhu.nl`)
      - traefik.http.routers.dockhand.entrypoints=https
      - traefik.http.routers.dockhand.tls=true
      - traefik.http.services.dockhand.loadbalancer.server.port=3000
    networks:
      - proxy
networks:
  proxy:
    external: true
