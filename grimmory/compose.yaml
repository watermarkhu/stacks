x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  grimmory:
    image: ghcr.io/grimmory-tools/grimmory:latest@sha256:bf6fe21c6e247597f7869664a440b5a34242e2d2940575cae39c17bfaa66dc0b
    container_name: grimmory
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=Europe/Amsterdam
      - DATABASE_URL=jdbc:mariadb://grimmory-db:3306/grimmory
      - DATABASE_USERNAME=grimmory
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - SWAGGER_ENABLED=false
    volumes:
      - /mnt/NVME/docker/grimmory/data:/app/data
      - /mnt/HDD4000/data/media/books:/books
      # BookDrop: watched folder, new files are detected and queued for import
      - /mnt/HDD4000/data/ingest/bookdrop:/bookdrop
    ports:
      - 6060:6060
    depends_on:
      grimmory-db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.grimmory.rule=Host(`grimmory.local.watermarkhu.nl`)
      - traefik.http.routers.grimmory.entrypoints=https
      - traefik.http.routers.grimmory.tls=true
      - traefik.http.services.grimmory.loadbalancer.server.port=6060
    networks:
      - proxy
      - grimmory

  grimmory-db:
    image: lscr.io/linuxserver/mariadb:11.8.9@sha256:7b4b9904c151bc50caf2ec9c5bc2213ceedc82c30eaf9ed2b0d47492ebffbe08
    container_name: grimmory-db
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=grimmory
      - MYSQL_USER=grimmory
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - /mnt/NVME/docker/grimmory/db:/config
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - grimmory

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest@sha256:0b400a5d58951b35bfede3d9943b632551259c31e130316fe56c5cc0e2e4faea
    container_name: shelfmark
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - AUTH_METHOD=builtin
      - CALIBRE_WEB_URL=https://grimmory.local.watermarkhu.nl
    volumes:
      - /mnt/NVME/docker/shelfmark-config:/config
      # Downloads land in Grimmory's BookDrop folder
      - /mnt/HDD4000/data/ingest/bookdrop:/books
      # Same paths as qbittorrent / sabnzbd, so completed downloads can be picked up
      - /mnt/HDD4000/data/torrents:/data/torrents
      - /mnt/HDD4000/data/usenet/complete:/data/usenet/complete
    ports:
      - 8084:8084
    restart: unless-stopped
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.shelfmark.rule=Host(`shelfmark.local.watermarkhu.nl`)
      - traefik.http.routers.shelfmark.entrypoints=https
      - traefik.http.routers.shelfmark.tls=true
      - traefik.http.services.shelfmark.loadbalancer.server.port=8084
    networks:
      - proxy
      - grimmory
networks:
  proxy:
    external: true
  grimmory: {}
